# Файлы, которые sysupgrade сохраняет дополнительно к /etc/config.
#
# /etc/titan_installed — маркер того, что роутер уже настроен.
# По нему uci-defaults/60_atlanta_panel отличает чистую прошивку от
# обновления: без маркера он ставит Wi-Fi и пароль панели по умолчанию,
# с маркером — не трогает настройки клиента.
#
# Если убрать отсюда эту строку, обновление с сохранением настроек
# сбросит клиенту Wi-Fi, пароль панели и LAN-адрес.
/etc/titan_installed

# /etc/titan_ota_state — счётчик попыток обновления. Без сохранения
# роутер забудет о неудачах и зациклится на битой публикации.
/etc/titan_ota_state

# /etc/titan_ota_status — итог последнего обновления, его отдаёт панели
# /cgi-bin/stats. Проверка ночная, опрос из панели приходит когда угодно,
# поэтому статус должен переживать перезагрузку.
/etc/titan_ota_status

# /etc/titan_load.log — срезы, снятые titan_loadwatch.sh при всплеске
# нагрузки. Ради них он и пишет в /etc, а не в /tmp: из полки роутер
# выходит перезагрузкой, а она уносит и syslog, и весь /tmp.
/etc/titan_load.log

# ── Родительский контроль ────────────────────────────────────────
# Состояние детского режима живёт в /etc, а sysupgrade сохраняет
# только перечисленное здесь. Без этих трёх строк обновление молча
# выключает фильтр: правила и списки исчезают, панель показывает
# режим отключённым, и родители узнают об этом последними.
#
# /etc/dnsmasq.d/guest-parental.conf — маркер «фильтр включён»,
# по нему панель рисует состояние переключателя.
/etc/dnsmasq.d/guest-parental.conf

# Правила nftables: их подхватывает fw4 сам, но только если файл есть.
/etc/nftables.d/25-guest-parental.nft

# Списки блокировок гостевого dnsmasq — и свои домены, и казино.
/etc/dnsmasq-guest.d/
