# IPv6 наружу не нужен — гасим на всех интерфейсах и на LAN.
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
net.ipv6.conf.br-lan.disable_ipv6=1

# ...но НЕ на петле, и это принципиально.
#
# netifd пишет в /etc/resolv.conf два сервера:
#     nameserver 127.0.0.1
#     nameserver ::1
# Резолвер musl, который используется в OpenWrt, опрашивает все
# перечисленные серверы разом. Если отправка на ::1 падает с "сеть
# недоступна", он валит запрос целиком — хотя 127.0.0.1 отвечает.
#
# Ломается всё, что резолвит имена штатным резолвером: curl, wget и,
# главное, frpc. Последний писал в лог
#     lookup ... on [::1]:53: read udp [::1]:53: connection refused
# и с loginFailExit уходил в crash loop, унося удалённый доступ.
# Снаружи роутер при этом выглядит здоровым: клиенты спрашивают
# dnsmasq напрямую и ответы получают.
#
# Строка обязана идти ПОСЛЕ all.disable_ipv6, иначе он её перебьёт.
net.ipv6.conf.lo.disable_ipv6=0
